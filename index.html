function projectedPoints(p){
  const d=projectionData[p.name];
  if(!d) return null;
  if(p.pos==='QB'||p.pos==='K'||p.pos==='DST') return d.half;
  if(state.scoring==='PPR') return +(d.half + (d.rec||0)*0.5).toFixed(1);
  if(state.scoring==='Standard') return +(d.half - (d.rec||0)*0.5).toFixed(1);
  return d.half;
}

function untilMyPick(){for(let i=state.pick;i<state.teams*state.rounds;i++)if(pickInfo(i).team===state.slot)return i-state.pick;return null}
function myPositions(){return state.drafted.filter(d=>d.pick.team===state.slot).map(d=>d.player.pos)}
function scorePlayer(p){let s=p.rank;const mine=myPositions(),count=x=>mine.filter(v=>v===x).length;if(p.pos==='RB'&&count('RB')<2)s-=8;if(p.pos==='WR'&&count('WR')<2)s-=8;if(p.pos==='QB'&&count('QB')===0&&state.pick>state.teams*3)s-=10;if(p.pos==='TE'&&count('TE')===0&&state.pick>state.teams*4)s-=6;if((p.pos==='K'||p.pos==='DST')&&state.pick<state.teams*10)s+=90;if(state.scoring==='PPR'&&p.pos==='WR')s-=2;if(state.scoring==='Standard'&&p.pos==='RB')s-=2;return s}
function draftPlayer(p){if(state.pick>=state.teams*state.rounds)return;const pk=pickInfo(state.pick);state.drafted.push({player:p,pick:pk});state.pick++;state.search='';$('search').value='';saveState();render();closeModals();showToast(`${p.name} → Team ${pk.team}`)}
function undo(){if(!state.drafted.length)return;const d=state.drafted.pop();state.pick=Math.max(0,state.pick-1);saveState();render();showToast(`Undid ${d.player.name}`)}
function resetDraft(){if(!confirm('Clear all picks and start over?'))return;state.pick=0;state.drafted=[];saveState();render()}
function openInfo(p){selected=p;$('infoRank').textContent=`OVERALL RANK #${p.custom?'—':p.rank}`;$('infoName').textContent=p.name;$('infoMeta').textContent=`${p.pos} · ${p.team}`;const rec=scorePlayer(p)<p.rank?'Fits a current roster need.':'Available based on overall ranking.';const pp=projectedPoints(p);$('recommendation').innerHTML=`<b>Draft snapshot</b><br>Rank: ${p.custom?'Custom':`#${p.rank}`} · Projection: ${pp==null?'Not loaded':pp.toFixed(1)+' pts'} (${state.scoring}) · ${rec}`;const s=sampleStats[p.name];if(s){$('statsGrid').innerHTML=[[s.games,'GAMES'],[s.a,s.labels[0]],[s.b,s.labels[1]],[s.td,'TD'],[s.ppg,'PPR PTS/G']].map(v=>`<div class="stat"><b>${v[0]}</b><span class="small muted">${v[1]}</span></div>`).join('');$('statNote').textContent='Sample prior-season stats loaded for this player.'}else{$('statsGrid').innerHTML='<div class="stat" style="grid-column:1/-1"><span class="muted">Detailed stats are not loaded for this player yet.</span></div>';$('statNote').textContent='Missing stats are left blank instead of guessed.'}$('playerNote').value=state.notes[p.id]||'';$('infoModal').classList.add('open')}
function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'))}
function render(){
  $('teamCount').value=state.teams;$('rounds').value=state.rounds;$('scoring').value=state.scoring;fillSlots();
  const cur=pickInfo(state.pick);$('pickLabel').textContent=cur.label;$('teamLabel').textContent=`Team ${cur.team}`;const yours=cur.team===state.slot;$('turnText').textContent=yours?'🏈 YOUR PICK':`Waiting for Team ${cur.team}`;$('turnText').className='big status '+(yours?'yours':'');const u=untilMyPick();$('nextYou').textContent=yours?'Choose your player below':u===null?'Draft complete':`${u} pick${u===1?'':'s'} until you`;$('myTeamLabel').textContent=`Team ${state.slot}`;
  const used=new Set(state.drafted.map(d=>d.player.id));let avail=pool.filter(p=>!used.has(p.id));$('poolCount').textContent=avail.length;if(state.pos!=='ALL')avail=avail.filter(p=>p.pos===state.pos);if(state.search)avail=avail.filter(p=>(p.name+' '+p.team).toLowerCase().includes(state.search));if(state.sortMode==='rank') avail.sort((a,b)=>a.rank-b.rank);
  else if(state.sortMode==='projection') avail.sort((a,b)=>{
    const ap=projectedPoints(a), bp=projectedPoints(b);
    if(ap==null && bp==null) return a.rank-b.rank;
    if(ap==null) return 1;
    if(bp==null) return -1;
    return bp-ap || a.rank-b.rank;
  });
  else avail.sort((a,b)=>scorePlayer(a)-scorePlayer(b));
  $('rankSortBtn').textContent=state.sortMode==='rank'?'RK ↑':'RK';
  $('projSortBtn').textContent=state.sortMode==='projection'?'PROJ ↓':'PROJ';
  $('rankSortBtn').classList.toggle('active',state.sortMode==='rank');
  $('projSortBtn').classList.toggle('active',state.sortMode==='projection');
  $('sortHelp').textContent=state.sortMode==='rank'?'Sorted by overall rank · tap PROJ for projected points.':state.sortMode==='projection'?`Sorted by ${state.scoring} projected season points · highest first.`:'Tap a player name for info · tap RK or PROJ to sort.';
  const list=$('playerList');list.innerHTML='';avail.slice(0,state.shown).forEach((p,idx)=>{const row=document.createElement('div');row.className='player-row';const proj=projectedPoints(p);row.innerHTML=`<div class="small muted">${p.custom?'—':p.rank}</div><div class="small"><b>${proj==null?'—':proj.toFixed(1)}</b></div><div><button type="button" class="pname-btn" aria-label="View ${p.name} player info">${p.name}</button><div class="small muted">${p.team}${idx<3?(state.sortMode==='rank'?' · Top ranked':state.sortMode==='projection'?' · Top projection':' · Recommended'):''}</div></div><div class="small"><b>${p.pos}</b></div>`;row.querySelector('.pname-btn').onclick=()=>openInfo(p);const draft=document.createElement('button');draft.className='btn primary';draft.textContent='Draft';draft.onclick=()=>draftPlayer(p);row.append(draft);list.appendChild(row)});$('moreBtn').style.display=avail.length>state.shown?'block':'none';
  const goals={QB:1,RB:2,WR:2,TE:1,K:1,DST:1};const mine=state.drafted.filter(d=>d.pick.team===state.slot);$('needs').innerHTML=Object.entries(goals).map(([p,n])=>{const h=mine.filter(d=>d.player.pos===p).length;return `<span class="tag need ${h>=n?'done':''}">${p} ${h}/${n}</span>`}).join('');$('roster').innerHTML=mine.length?mine.map(d=>`<div class="roster-row"><span>${d.player.name}</span><span class="muted">${d.player.pos}</span></div>`).join(''):'<div class="small muted">Your roster is empty.</div>';
  $('recent').innerHTML=state.drafted.length?state.drafted.slice(-6).reverse().map(d=>`<div class="recent-row"><span>${d.pick.label} · T${d.pick.team}</span><b>${d.player.name}</b></div>`).join(''):'<div class="small muted">No picks yet.</div>';
  $('nextPicks').innerHTML='';for(let i=0;i<6;i++){const n=pickInfo(state.pick+i);const c=document.createElement('div');c.className='next-cell '+(n.team===state.slot?'me':'');c.innerHTML=`<b>${n.label}</b><br><span class="muted">T${n.team}</span>`;$('nextPicks').appendChild(c)}
  $('undoBtn').disabled=!state.drafted.length;saveState();
}
['ALL','QB','RB','WR','TE','K','DST'].forEach(pos=>{const b=document.createElement('button');b.className='btn filter '+(state.pos===pos?'active':'');b.textContent=pos;b.onclick=()=>{state.pos=pos;state.shown=40;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};$('filters').appendChild(b)});
$('rankSortBtn').onclick=()=>{state.sortMode=state.sortMode==='rank'?'recommended':'rank';state.shown=40;saveState();render();showToast(state.sortMode==='rank'?'Sorted by rank':'Recommendation order')};$('projSortBtn').onclick=()=>{state.sortMode=state.sortMode==='projection'?'recommended':'projection';state.shown=40;saveState();render();showToast(state.sortMode==='projection'?'Sorted by projection':'Recommendation order')};$('teamCount').onchange=e=>{state.teams=+e.target.value;state.slot=Math.min(state.slot,state.teams);state.pick=0;state.drafted=[];render()};$('mySlot').onchange=e=>{state.slot=+e.target.value;render()};$('rounds').onchange=e=>{state.rounds=+e.target.value;render()};$('scoring').onchange=e=>{state.scoring=e.target.value;saveState();render();showToast(`${state.scoring} projections loaded`)};$('search').oninput=e=>{state.search=e.target.value.trim().toLowerCase();state.shown=40;render()};$('undoBtn').onclick=undo;$('resetBtn').onclick=resetDraft;$('moreBtn').onclick=()=>{state.shown+=40;render()};$('missingBtn').onclick=()=>$('missingModal').classList.add('open');$('closeMissing').onclick=closeModals;$('addMissingDraft').onclick=()=>{const name=$('missingName').value.trim();if(!name)return alert('Enter the player name.');const p={id:Date.now(),name,pos:$('missingPos').value,team:$('missingTeam').value.trim().toUpperCase()||'FA',rank:9999,custom:true};pool.push(p);state.customPlayers=pool.filter(x=>x.custom);$('missingName').value='';$('missingTeam').value='';draftPlayer(p)};$('closeInfo').onclick=closeModals;$('draftFromInfo').onclick=()=>selected&&draftPlayer(selected);$('saveNote').onclick=()=>{if(selected){state.notes[selected.id]=$('playerNote').value;saveState();showToast('Note saved')}};$('teamsBtn').onclick=()=>{const box=$('allTeams');box.innerHTML='';for(let t=1;t<=state.teams;t++){const picks=state.drafted.filter(d=>d.pick.team===t);const c=document.createElement('div');c.className='team-card';c.innerHTML=`<b>Team ${t}${t===state.slot?' · YOU':''}</b><div class="small" style="margin-top:6px">${picks.length?picks.map(d=>`${d.player.pos} · ${d.player.name}`).join('<br>'):'<span class="muted">No players</span>'}</div>`;box.appendChild(c)}$('teamsModal').classList.add('open')};$('closeTeams').onclick=closeModals;document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModals()}));
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script>
